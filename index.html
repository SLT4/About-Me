<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>SLT | About Me</title>
	<link rel="stylesheet" href="https://kit-pro.fontawesome.com/releases/v6.7.2/css/pro.min.css">
	<link href='https://fonts.googleapis.com/css?family=Lato:300,400,700' rel='stylesheet' type='text/css'>
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<div class="background-wrapper">
		<div id="stars"></div>
		<div id="stars2"></div>
		<div id="stars3"></div>
	</div>
	<div class="language-switch">
		<button class="lang-btn" data-lang="en">EN</button>
		<button class="lang-btn active" data-lang="ar">ع</button>
	</div>
	<img src="SLT.png" class="profile-img">
	<div class="about">
		<h2>SLT</h2>
		<p data-en="Senior high school student, interested in programming and streaming"
			data-ar="طالب أخر سنه فالثانوي، مهتم بالبرمجه والستريمنق" class="about-text">طالب أخر سنه فالثانوي، مهتم
			بالبرمجه والستريمنق</p>
	</div>
	<div class="container-cards" id="socialCards"></div>
	<div class="scroll-arrow">
		<i class="fa-solid fa-chevron-down"></i>
	</div>
	<script src="js/main.js"></script>
</body>

</html>
